services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mailcord-tunnel
    restart: always
    network_mode: host
    command: tunnel --edge-ip-version 4 --protocol http2 --url http://127.0.0.1:3006 run --token eyJhIjoiYjdhMmRiZjU1ZjEyYTEzYjA2YzFmN2E1MWRjNTkwNTkiLCJzIjoibUtURS9MR3k5VnlOczRRTkNXYlhhN0RWTWt5WXdqWDdQUWUwc1RKblF6ST0iLCJ0IjoiNWU1YWY1MTAtOGEyZS00NGFjLTgwN2EtNzM5MWQ2NmM5YWVjIn0=

  postgres:
    image: postgres:15-alpine
    container_name: mailcord-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mailcord_billing
    ports:
      - '5433:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  mongodb:
    image: mongo:6
    container_name: mailcord-mongodb
    restart: always
    ports:
      - '27018:27017'
    volumes:
      - ./data/mongodb:/data/db

  redis:
    image: redis:7-alpine
    container_name: mailcord-redis
    restart: always
    ports:
      - '6380:6379'
    volumes:
      - ./data/redis:/data

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
